services:
  yt-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-mp3-mp4-converter
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DOWNLOAD_DIR=/tmp/yt-converter-downloads
      - NODE_ENV=production
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-500}
      - STATE_DIR=/tmp/yt-converter-downloads/.state
      - UPLOAD_DIR=/tmp/yt-converter-downloads/.uploads
      - JOB_CONCURRENCY=${JOB_CONCURRENCY:-2}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-10}
      - MAX_PENDING_UPLOAD_BYTES=${MAX_PENDING_UPLOAD_BYTES:-4294967296}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-2147483648}
      - JOB_TTL_SECONDS=${JOB_TTL_SECONDS:-259200}
      - CLEANUP_INTERVAL_SECONDS=${CLEANUP_INTERVAL_SECONDS:-3600}
      - SHUTDOWN_GRACE_SECONDS=${SHUTDOWN_GRACE_SECONDS:-300}
      - INSTRUMENTAL_TIMEOUT_SECONDS=${INSTRUMENTAL_TIMEOUT_SECONDS:-7200}
      - UPLOAD_IDLE_TIMEOUT_SECONDS=${UPLOAD_IDLE_TIMEOUT_SECONDS:-60}
    volumes:
      # Persist job state, uploads, and completed downloads together.
      - ./downloads:/tmp/yt-converter-downloads
    stop_grace_period: 330s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
